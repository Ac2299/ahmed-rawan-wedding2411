<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أحمد & روان | دعوة زفاف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF4EA;
    --teal:#0E4F52;
    --gold:#B8912F;
    --ink:#1C2624;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Cairo',sans-serif;
    overflow-x:hidden;
  }
  body.no-scroll{overflow:hidden; height:100vh;}

  /* الدخلة السينمائية البسيطة والسريعة */
  .envelope-overlay{
    position:fixed;
    inset:0;
    z-index:9999;
    background:var(--cream);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    transition:opacity 0.6s ease, visibility 0.6s ease;
  }
  .envelope-overlay.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  
  .card-box{
    width:85%;
    max-width:380px;
    background:#fff;
    border:2px solid var(--gold);
    padding:40px 20px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.15);
    border-radius:8px;
    margin-bottom:30px;
  }
  .card-box h1{
    font-family:'Aref Ruqaa',serif;
    font-size:36px;
    color:var(--teal);
    margin:10px 0;
  }
  .card-box p{
    color:var(--gold);
    font-size:14px;
    letter-spacing:2px;
    margin-bottom:20px;
  }

  /* زر الختم الواضح والجاهز للضغط */
  .seal-btn{
    width:80px;
    height:80px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #C99A3E, var(--gold) 60%, #7f5f1c 100%);
    border:3px solid #fff;
    color:#FAF4EA;
    font-family:'Aref Ruqaa',serif;
    font-size:22px;
    cursor:pointer;
    box-shadow:0 8px 20px rgba(0,0,0,0.3);
    display:flex;
    align-items:center;
    justify-content:center;
    transition:transform 0.2s ease;
  }
  .seal-btn:active{transform:scale(0.92);}
  
  .tap-text{
    margin-top:15px;
    font-size:13px;
    color:var(--teal);
    letter-spacing:1px;
    font-weight:600;
  }

  /* محتوى الموقع الأساسي */
  .main-content{
    padding:40px 20px;
    text-align:center;
    max-width:500px;
    margin:0 auto;
  }
  .main-content h2{
    font-family:'Aref Ruqaa',serif;
    font-size:40px;
    color:var(--teal);
  }
</style>
</head>
<body id="body-root" class="no-scroll">

<!-- غطاء الدخلة -->
<div class="envelope-overlay" id="intro-overlay">
  <div class="card-box">
    <p>دعوة زفاف مباركة</p>
    <h1>أحمد & روان</h1>
    <span style="color:#777; font-size:13px;">٢٤ نوفمبر ٢٠٢٦</span>
  </div>
  
  <button type="button" class="seal-btn" id="open-btn">A&R</button>
  <div class="tap-text">اضغط هنا لفتح الدعوة</div>
</div>

<!-- الموقع من جوة -->
<div class="main-content">
  <p>بسم الله الرحمن الرحيم</p>
  <h2>أهلاً بكم في حفل زفافنا</h2>
  <p>يسعدنا حضوركم وتشريفكم لنا يوم الثلاثاء ٢٤ نوفمبر ٢٠٢٦ في قاعة الفيروز.</p>
  
  <br><br>
  <a href="https://wa.me/201276531456" target="_blank" style="background:var(--teal); color:#fff; padding:12px 30px; text-decoration:none; border-radius:4px; display:inline-block;">تأكيد الحضور عبر واتساب</a>
</div>

<script>
  const overlay = document.getElementById('intro-overlay');
  const openBtn = document.getElementById('open-btn');
  const bodyRoot = document.getElementById('body-root');

  // أول ما تضغط على زر الختم، الغطاء هيختفي فوراً والموقع يفتح معاك بسلاسة
  openBtn.addEventListener('click', function() {
    overlay.classList.add('hidden');
    bodyRoot.classList.remove('no-scroll');
    
    // تشغيل الصوت لو موجود
    var audio = document.getElementById('wedding-audio');
    if(audio) {
      audio.play().catch(function(e){});
    }
  });
</script>

</body>
</html>
