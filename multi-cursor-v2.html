<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050305">
<title>Ahmed &amp; Rawan | Cursor build</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@500;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
  :root{--rose:#D6405F;--gold:#E8D6B0;--txt:#F2EEF0;--blue:#38BDF8}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;font-family:'Space Grotesk',sans-serif;color:var(--txt)}
  body{background:#050305;transition:background 1s ease}
  body[data-s=gray]{background:#2b2b30}
  body[data-s=final]{background:radial-gradient(70vmax 50vmax at 80% -5%,rgba(214,64,95,.22),transparent 60%),#0a0508}
  .stage{position:relative;width:min(100vw,520px);height:100dvh;margin:0 auto;overflow:hidden}

  .el{position:absolute;display:flex;flex-direction:column;justify-content:center;clip-path:inset(-8px 100% 100% -8px)}
  .el.show{clip-path:inset(-8px -8px -8px -8px)}
  .el.wire{background:rgba(190,190,200,.14)!important;border-color:transparent!important}
  .el>.c{width:100%;opacity:0;transition:opacity .8s ease .1s}
  .el.final>.c{opacity:1}
  .wf{position:absolute;inset:0;border:1px solid var(--blue);opacity:0;transition:opacity .5s;pointer-events:none}
  .el.wire .wf{opacity:1}
  .wf i{position:absolute;width:7px;height:7px;background:#fff;border:1px solid var(--blue)}
  .wf i:nth-child(1){left:-4px;top:-4px}.wf i:nth-child(2){right:-4px;top:-4px}.wf i:nth-child(3){left:-4px;bottom:-4px}.wf i:nth-child(4){right:-4px;bottom:-4px}
  .wf em{position:absolute;left:-1px;top:-19px;font:700 10px 'Space Grotesk',sans-serif;font-style:normal;background:var(--blue);color:#06202c;padding:2px 6px;white-space:nowrap}
  .ghost{background:rgba(190,190,200,.1);transition:opacity .6s}
  .ghost.gone{opacity:0}

  .head{left:5%;top:8%;width:90%;height:15%}
  .head .c{font:400 clamp(70px,28vw,150px)/.95 'Anton',Impact,sans-serif;color:rgba(214,64,95,.1);-webkit-text-stroke:2px #D6405F;letter-spacing:.01em}
  .hello{left:5%;top:25%;width:62%;height:12%}
  .hello .c{font:italic 500 26px 'Cormorant Garamond',serif;color:rgba(242,238,240,.85)}
  .hello b{display:inline-block;margin-top:4px;font:400 clamp(26px,8vw,36px) 'Anton',Impact,sans-serif;background:var(--rose);color:#fff;padding:2px 12px;letter-spacing:.03em}
  .photo{left:5%;top:40%;width:50%;height:24%;background:linear-gradient(150deg,#D6405F,#6b1128 70%);align-items:center}
  .photo .c{text-align:center;font:400 54px/1 'Anton',Impact,sans-serif;color:rgba(255,255,255,.92)}
  .photo small{display:block;font:700 11px 'Space Grotesk';letter-spacing:.3em;margin-top:6px}
  .text{left:59%;top:40%;width:36%;height:24%}
  .text .c{font-size:13px;line-height:1.7;color:rgba(242,238,240,.72)}
  .text b{color:var(--gold);display:block;font-size:11px;letter-spacing:.2em;margin-bottom:4px}
  .label{left:5%;top:67%;width:90%;height:4%;border-bottom:1px solid rgba(214,64,95,.5)}
  .label .c{font:700 12px 'Space Grotesk';letter-spacing:.25em;color:var(--rose)}
  .card{top:73%;height:14%;width:28%;border-radius:14px;background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.14);align-items:center;text-align:center}
  .card .c{font-size:11px;letter-spacing:.18em;color:rgba(242,238,240,.7)}
  .card b{display:block;font:400 28px 'Anton',Impact,sans-serif;color:var(--gold);letter-spacing:.02em;margin-bottom:2px}
  .k1{left:5%}.k2{left:36%}.k3{left:67%}
  .cta{left:5%;top:90%;width:90%;height:6%;background:var(--rose);border-radius:12px;align-items:center}
  .cta .c{text-align:center;font:700 14px 'Space Grotesk';letter-spacing:.18em;color:#fff}

  .cur{position:absolute;left:0;top:0;z-index:20;pointer-events:none;opacity:0;transition:opacity .35s;will-change:transform}
  .cur.on{opacity:1}
  .cur svg{display:block;width:17px;height:17px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
  .replay{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;border:1px solid rgba(255,255,255,.25);background:rgba(10,5,8,.75);color:var(--txt);font:700 13px 'Space Grotesk',sans-serif;padding:10px 18px;border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .5s}
  .replay.on{opacity:1;pointer-events:auto}
</style>
</head>
<body data-s="black">
<div class="stage" id="stage">
  <div class="el head" data-n="Heading"><div class="c">WEDDING</div></div>
  <div class="el hello" data-n="Hello"><div class="c">Hello, we're<br><b>AHMED &amp; RAWAN.</b></div></div>
  <div class="el photo" data-n="Image"><div class="c">A&amp;R<small>EST. 2026</small></div></div>
  <div class="el text" data-n="Text"><div class="c"><b>THE DETAILS</b>Tuesday<br>24 Nov 2026<br>El Fayroz Hall</div></div>
  <div class="el label" data-n="Label"><div class="c">DETAILS &amp; SCHEDULE</div></div>
  <div class="el card k1" data-n="Card 1"><div class="c"><b>9 PM</b>DOORS</div></div>
  <div class="el card k2" data-n="Card 2"><div class="c"><b>10 PM</b>ZAFFA</div></div>
  <div class="el card k3" data-n="Card 3"><div class="c"><b>24</b>NOVEMBER</div></div>
  <div class="el cta" data-n="Button"><div class="c">RSVP →</div></div>
  <button class="replay" id="replay">↻ Replay</button>
</div>
<script>
(function(){
  var stage=document.getElementById('stage'),rp=document.getElementById('replay');
  var N=16,EASE='cubic-bezier(.45,0,.2,1)',timers=[],tick=null;
  var ghosts=[[60,4,35,4,'Nav'],[5,38,50,1.2,'Divider'],[60,65,35,3,'Group 7'],[5,72,60,1.2,'Line'],[70,87,25,2.5,'Frame 31'],[5,88,40,1.5,'Rule']];
  ghosts.forEach(function(g){var e=document.createElement('div');e.className='el ghost';e.dataset.n=g[4];e.style.cssText='left:'+g[0]+'%;top:'+g[1]+'%;width:'+g[2]+'%;height:'+g[3]+'%';stage.insertBefore(e,rp)});
  var els=[].slice.call(document.querySelectorAll('.el'));
  els.forEach(function(e){var w=document.createElement('div');w.className='wf';w.innerHTML='<i></i><i></i><i></i><i></i><em>'+e.dataset.n+'</em>';e.appendChild(w)});
  var cur=[];
  for(var i=0;i<N;i++){var d=document.createElement('div');d.className='cur';d.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 2l17 8-7.5 2.2L10 20z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>';stage.insertBefore(d,rp);cur.push(d)}
  function at(ms,fn){timers.push(setTimeout(fn,ms))}
  function pos(c,x,y,ms,ease){c.style.transition='transform '+ms+'ms '+(ease||EASE)+',opacity .35s';c.style.transform='translate('+x+'px,'+y+'px)'}
  function rect(e){var s=stage.getBoundingClientRect(),r=e.getBoundingClientRect();return{x:r.left-s.left,y:r.top-s.top,w:r.width,h:r.height}}
  function rnd(a,b){return a+Math.random()*(b-a)}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
  function reset(){
    timers.forEach(clearTimeout);timers=[];clearInterval(tick);rp.classList.remove('on');
    document.body.dataset.s='black';
    els.forEach(function(e){e.style.transition='none';e.classList.remove('show','wire','final','gone')});
    void stage.offsetWidth;els.forEach(function(e){e.style.transition=''});
    cur.forEach(function(c){c.classList.remove('on')});
  }
  function run(){
    reset();
    var W=stage.clientWidth,H=stage.clientHeight;
    if(matchMedia('(prefers-reduced-motion:reduce)').matches){
      document.body.dataset.s='final';els.forEach(function(e){e.style.transition='none';e.classList.add('show','final')});
      document.querySelectorAll('.ghost').forEach(function(g){g.classList.add('gone')});return;
    }
    // 1) swarm in the centre
    cur.forEach(function(c,i){pos(c,W/2+rnd(-45,45),H*.45+rnd(-45,45),0);at(200+i*40,function(){c.classList.add('on')})});
    // 2) spread out
    at(1300,function(){cur.forEach(function(c){pos(c,rnd(10,W-30),rnd(40,H-40),rnd(700,1100))})});
    // 3) wireframe drawing
    at(2500,function(){document.body.dataset.s='gray'});
    var order=shuffle(els.slice()),t=2700,D=950;
    order.forEach(function(el,k){
      var c=cur[k%N],r=rect(el);
      at(t,function(){pos(c,r.x,r.y,600)});
      at(t+650,function(){el.style.transition='clip-path '+D+'ms '+EASE+',background .9s ease,border-color .9s ease';el.classList.add('wire','show');pos(c,r.x+r.w,r.y+r.h,D)});
      t+=330;
    });
    // idle cursors keep wandering
    tick=setInterval(function(){cur.slice(order.length>N?0:order.length).forEach(function(c){pos(c,rnd(10,W-30),rnd(40,H-40),900)})},1000);
    var end=t+D+700;
    // 4) resolve to the real design
    at(end,function(){
      clearInterval(tick);document.body.dataset.s='final';
      els.forEach(function(e,i){setTimeout(function(){
        if(e.classList.contains('ghost'))e.classList.add('gone');
        else{e.classList.remove('wire');e.classList.add('final')}
      },i*90)});
    });
    // 5) cursors leave
    at(end+1800,function(){cur.forEach(function(c,i){pos(c,i%2?W+60:-60,rnd(20,H),1200)})});
    at(end+2800,function(){cur.forEach(function(c){c.classList.remove('on')});rp.classList.add('on')});
  }
  rp.addEventListener('click',run);
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(run);
})();
</script>
</body>
</html>
